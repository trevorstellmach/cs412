<!-- mini_insta/show_post.html -->
{% extends 'mini_insta/base.html' %}

{% block content %}
<h1>Create Post</h1>
<form method="POST" action="{% url 'create_post' profile.pk %}">
    {% csrf_token %}
    
    <table>
        {{form.as_table}}
    </table>
    <table>
        <strong>Image URL: </strong><input type="text" name="img_url">
    </table>


    <input type="submit" name="submit" value="Submit">
    <a href="{% url 'show_profile' profile.pk %}">Cancel</a>
</form>

{% endblock %}
