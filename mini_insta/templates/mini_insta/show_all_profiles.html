{% extends 'mini_insta/base.html' %}

{% block content %}

    {% for profile in profiles %}
    
    <main class="grid-container">
        <h2>{{profile.username}}</h2>
        <h2>{{profile.display_name}}</h2>
        <img src="{{profile.image_url}}" alt="">
        <p>{{profile.bio_text}}</p>
        <p>{{profile.join_date}}</p>
    </main>


    {% endfor %}

{% endblock %}
