<!-- voter_analytics/templates/voter_analytics/search.html -->
<h1>Filter</h1>

<table>
    <form action="{% url 'voters' %}">

        <tr>
            <th>Party:</th>
            <td><select name="party" id="party">
                <option value selected hidden>Choose</option>
                {% for party in parties %}
                <option value="{{party}}" {% if party == selected_party %}selected{% endif %}>
                    {{party}}
                </option>
                {% endfor %}
            </select></td>
        </tr>

        <tr>
            <th>Voter Score:</th>
            <td><select name="score" id="score">
                    <option value selected hidden >Choose</option>
                    {% for score in scores %}
                    <option value="{{score}}" {% if score == selected_voter_score %}selected{% endif %} >{{score}}</option>
                    {% endfor %}
                </select></td>
        </tr>

        <tr>
            <th>Minimum Year of Birth:</th>
            <td><select name="min_dob" id="min_dob">
                    <option value selected hidden >Choose</option>
                    {% for year in years %}
                        <option value="{{year}}" {% if year == selected_min_dob %}selected{% endif %}>{{year}}</option>
                    {% endfor %}
                </select></td>
        </tr>

        <tr>
            <th>Maximum Year of Birth:</th>
            <td><select name="max_dob" id="max_dob">
                    <option value selected hidden >Choose</option>
                    {% for year in years %}
                    <option value="{{year}}"{% if year == selected_max_dob %}selected{% endif %}>{{year}}</option>
                    {% endfor %}
                </select></td>
        </tr>

        <tr>
            <th>Previous Election Participation:</th>
            {% for election in elections %}
            <td><input type="checkbox" name="{{election}}" id="{{election}}" {% if election in request.GET %}checked{% endif %}>
                <label for="{{election}}">{{election}}</label></td>
            {% endfor %}
        </tr>



        <tr>
            <td><input type="submit"></td>
            <td></td>
        </tr>

    </form>
</table>
